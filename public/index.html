<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08090c"
    >

    <title>
        Zis Luau Obfuscate Premium
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                Z
            </div>

            <div>
                <div class="title">
                    Zis Luau Obfuscate
                </div>

                <div class="version">
                    Premium v0.1
                </div>
            </div>

        </div>

        <div
            id="status"
            class="status"
        >
            <span class="status-dot"></span>
            Online
        </div>

    </header>


    <!-- Main -->

    <main class="container">

        <!-- Input -->

        <section class="panel">

            <div class="panel-header">

                <div>
                    <div class="panel-title">
                        Input
                    </div>

                    <div class="panel-subtitle">
                        Paste your Luau source code
                    </div>
                </div>

                <button
                    id="clearInput"
                    class="small-button"
                >
                    Clear
                </button>

            </div>

            <textarea
                id="inputCode"
                class="code-editor"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                placeholder="Paste Luau code here..."
            ></textarea>

            <div class="editor-info">

                <span>
                    <span id="inputLines">0</span>
                    lines
                </span>

                <span>
                    <span id="inputChars">0</span>
                    chars
                </span>

            </div>

        </section>


        <!-- Protection -->

        <section class="panel">

            <div class="panel-header">

                <div>
                    <div class="panel-title">
                        Protection
                    </div>

                    <div class="panel-subtitle">
                        Select obfuscation layers
                    </div>
                </div>

            </div>


            <div class="options">

                <label class="option">

                    <div class="option-text">

                        <span class="option-title">
                            Identifier Rename
                        </span>

                        <span class="option-description">
                            Rename local identifiers
                        </span>

                    </div>

                    <input
                        type="checkbox"
                        id="rename"
                        checked
                    >

                    <span class="switch"></span>

                </label>


                <label class="option">

                    <div class="option-text">

                        <span class="option-title">
                            Constant Hiding
                        </span>

                        <span class="option-description">
                            Transform constant values
                        </span>

                    </div>

                    <input
                        type="checkbox"
                        id="constants"
                        checked
                    >

                    <span class="switch"></span>

                </label>


                <label class="option">

                    <div class="option-text">

                        <span class="option-title">
                            String Transform
                        </span>

                        <span class="option-description">
                            Transform string literals
                        </span>

                    </div>

                    <input
                        type="checkbox"
                        id="strings"
                        checked
                    >

                    <span class="switch"></span>

                </label>


                <label class="option">

                    <div class="option-text">

                        <span class="option-title">
                            Number Transform
                        </span>

                        <span class="option-description">
                            Transform numeric constants
                        </span>

                    </div>

                    <input
                        type="checkbox"
                        id="numbers"
                        checked
                    >

                    <span class="switch"></span>

                </label>


                <label class="option">

                    <div class="option-text">

                        <span class="option-title">
                            Control Flow
                        </span>

                        <span class="option-description">
                            Transform control-flow structure
                        </span>

                    </div>

                    <input
                        type="checkbox"
                        id="controlFlow"
                    >

                    <span class="switch"></span>

                </label>

            </div>

        </section>


        <!-- Obfuscate -->

        <button
            id="obfuscateButton"
            class="obfuscate-button"
        >

            <span id="buttonText">
                OBFUSCATE
            </span>

            <span
                id="loader"
                class="loader hidden"
            ></span>

        </button>


        <!-- Output -->

        <section class="panel output-panel">

            <div class="panel-header">

                <div>
                    <div class="panel-title">
                        Output
                    </div>

                    <div class="panel-subtitle">
                        Obfuscated Luau source
                    </div>
                </div>

                <div class="output-actions">

                    <button
                        id="copyButton"
                        class="small-button"
                    >
                        Copy
                    </button>

                    <button
                        id="downloadButton"
                        class="small-button"
                    >
                        Download
                    </button>

                </div>

            </div>


            <textarea
                id="outputCode"
                class="code-editor output-editor"
                spellcheck="false"
                readonly
                placeholder="Obfuscated output will appear here..."
            ></textarea>


            <div class="editor-info">

                <span>
                    <span id="outputLines">0</span>
                    lines
                </span>

                <span>
                    <span id="outputChars">0</span>
                    chars
                </span>

            </div>

        </section>


        <!-- Footer -->

        <footer>

            <span>
                Zis Luau Obfuscate
            </span>

            <span>
                Premium v0.1
            </span>

        </footer>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="/app.js"></script>

</body>
</html>
